<!DOCTYPE html>
<!-- cse6242 -->

<!-- run: http-server & -->

<head>
  <style>    
    /* Define CSS rules */
    body {
      font-family: Arial, sans-serif;
    }
    .bar {
      fill: steelblue;
    }
    .axis-label {
      font-size: 14px;
      font-weight: bold;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }
  </style>
  <title>Wildlife Trafficking Incidents per Species (2015 to 2023)</title>
</head>

<body>

  <script src="lib/d3/d3.min.js"></script>
  <script src="lib/d3-dsv/d3-dsv.min.js"></script>
  <script src="lib/d3-fetch/d3-fetch.min.js"></script>

  <script>
    // Define margins and dimensions
    var margin = {top: 50, right: 20, bottom: 50, left: 150};
    var width = 800 - margin.left - margin.right;
    var height = 500 - margin.top - margin.bottom;

    // Create scales
    var x = d3.scaleLinear().range([0, width]);
    var y = d3.scaleBand().range([0, height]).padding(0.2);

    // Append SVG element
    var svg = d3.select("body").append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
      .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    // Load data
    d3.dsv(",", "q3.csv", function(d) {
      return { species: d.species, count: +d.count };
    }).then(function(data) {
      
      // Get top 5 species by count
      data.sort((a, b) => b.count - a.count);
      data = data.slice(0, 5);
      
      // Set domain for scales
      x.domain([0, d3.max(data, d => d.count)]);
      y.domain(data.map(d => d.species));

      // Add bars
      svg.selectAll(".bar")
          .data(data)
        .enter().append("rect")
          .attr("class", "bar")
          .attr("y", d => y(d.species))
          .attr("height", y.bandwidth())
          .attr("x", 0)
          .attr("width", d => x(d.count))
          .attr("fill", (d, i) => d3.schemeSet2[i]);

      // Add X Axis
      svg.append("g")
          .attr("id", "x_axis")
          .attr("transform", "translate(0," + height + ")")
          .call(d3.axisBottom(x).ticks(d3.max(data, d => d.count) / 500));
      
      // Add Y Axis
      svg.append("g")
          .attr("id", "y_axis")
          .call(d3.axisLeft(y));
      
      // Add X Axis Label
      svg.append("text")
          .attr("id", "x_axis_label")
          .attr("x", width / 2)
          .attr("y", height + margin.bottom - 10)
          .attr("text-anchor", "middle")
          .attr("class", "axis-label")
          .text("Count");

      // Add Y Axis Label
      svg.append("text")
          .attr("id", "y_axis_label")
          .attr("x", -height / 2)
          .attr("y", -margin.left + 20)
          .attr("transform", "rotate(-90)")
          .attr("text-anchor", "middle")
          .attr("class", "axis-label")
          .text("Species");

      // Add Title
      svg.append("text")
          .attr("id", "title")
          .attr("x", width / 2)
          .attr("y", -10)
          .attr("class", "title")
          .text("Wildlife Trafficking Incidents per Species (2015 to 2023)");

      // Add GT username
      svg.append("text")
          .attr("id", "credit")
          .attr("x", width)
          .attr("y", height + margin.bottom - 5)
          .attr("text-anchor", "end")
          .attr("font-size", "12px")
          .text("GT Username: [Your GT Username Here]");
    }).catch(function(error) {
      console.log(error);
    });
  </script>
</body>
